<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparador de Precios</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        header {
            background: #111;
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
        }

        header p {
            margin-top: 10px;
            color: #ccc;
        }

        .contenedor {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
        }

        .buscador {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        input {
            flex: 1;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 15px 20px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .producto {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .producto h2 {
            margin-top: 0;
        }

        .tienda {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #eee;
            padding: 15px 0;
        }

        .precio {
            font-size: 20px;
            font-weight: bold;
        }

        .ver {
            background: #eee;
            color: #111;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 7px;
        }

        #resultados {
            display: none;
        }
    </style>
</head>

<body>

<header>
    <h1>Comparador de Precios</h1>
    <p>Encuentra el mejor precio en diferentes tiendas</p>
</header>

<div class="contenedor">

    <div class="buscador">
        <input id="busqueda" type="text" placeholder="¿Qué producto buscas?">
        <button onclick="buscar()">Buscar</button>
    </div>

    <div id="resultados">

        <div class="producto">
            <h2 id="nombreProducto"></h2>

            <div class="tienda">
                <span>Tienda 1</span>
                <span class="precio">599 €</span>
                <a class="ver" href="#" target="_blank">Ver</a>
            </div>

            <div class="tienda">
                <span>Tienda 2</span>
                <span class="precio">619 €</span>
                <a class="ver" href="#" target="_blank">Ver</a>
            </div>

            <div class="tienda">
                <span>Tienda 3</span>
                <span class="precio">649 €</span>
                <a class="ver" href="#" target="_blank">Ver</a>
            </div>

        </div>

    </div>

</div>

<script>
function buscar() {

    const producto = document.getElementById("busqueda").value;

    if (producto.trim() === "") {
        alert("Escribe un producto primero.");
        return;
    }

    document.getElementById("nombreProducto").textContent = producto;
    document.getElementById("resultados").style.display = "block";
}
</script>

</body>
</html>
